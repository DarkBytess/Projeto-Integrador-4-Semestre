<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Splash icon - white leaf on transparent -->
  <g transform="translate(100, 100)">
    <!-- Main leaf -->
    <path d="M-36 20 
             C-36 -30, 0 -60, 40 -60 
             C40 -20, 20 20, -10 40 
             C-20 30, -30 24, -36 20Z" 
          fill="white"/>
    
    <!-- Leaf vein -->
    <path d="M-10 40 C0 10, 10 -10, 30 -40" 
          stroke="rgba(22, 163, 74, 0.4)" 
          stroke-width="4" 
          fill="none"
          stroke-linecap="round"/>
  </g>
  
  <!-- Signal waves -->
  <g transform="translate(135, 56)" stroke="white" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M0 12 A12 12 0 0 1 12 0" opacity="0.5"/>
    <path d="M0 24 A24 24 0 0 1 24 0" opacity="0.7"/>
    <path d="M0 36 A36 36 0 0 1 36 0" opacity="0.9"/>
  </g>
</svg>
