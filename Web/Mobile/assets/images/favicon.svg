<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#16A34A"/>
  
  <!-- Leaf icon -->
  <g transform="translate(256, 256)">
    <!-- Main leaf -->
    <path d="M-90 50 
             C-90 -75, 0 -150, 100 -150 
             C100 -50, 50 50, -25 100 
             C-50 75, -75 60, -90 50Z" 
          fill="white" 
          opacity="0.95"/>
    
    <!-- Leaf vein -->
    <path d="M-25 100 C0 25, 25 -25, 75 -100" 
          stroke="rgba(22, 163, 74, 0.4)" 
          stroke-width="10" 
          fill="none"
          stroke-linecap="round"/>
  </g>
  
  <!-- Signal waves -->
  <g transform="translate(340, 140)" stroke="white" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M0 30 A30 30 0 0 1 30 0" opacity="0.5"/>
    <path d="M0 60 A60 60 0 0 1 60 0" opacity="0.7"/>
    <path d="M0 90 A90 90 0 0 1 90 0" opacity="0.9"/>
  </g>
</svg>
