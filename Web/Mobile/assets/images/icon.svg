<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="#16A34A"/>
  
  <!-- Leaf icon -->
  <g transform="translate(512, 512)">
    <!-- Main leaf -->
    <path d="M-180 100 
             C-180 -150, 0 -300, 200 -300 
             C200 -100, 100 100, -50 200 
             C-100 150, -150 120, -180 100Z" 
          fill="white" 
          opacity="0.95"/>
    
    <!-- Leaf vein -->
    <path d="M-50 200 C0 50, 50 -50, 150 -200" 
          stroke="rgba(22, 163, 74, 0.4)" 
          stroke-width="20" 
          fill="none"
          stroke-linecap="round"/>
    
    <!-- Small leaf veins -->
    <path d="M0 100 C30 60, 60 40, 100 -20" 
          stroke="rgba(22, 163, 74, 0.3)" 
          stroke-width="12" 
          fill="none"
          stroke-linecap="round"/>
    <path d="M-80 60 C-40 20, 0 -20, 60 -100" 
          stroke="rgba(22, 163, 74, 0.3)" 
          stroke-width="12" 
          fill="none"
          stroke-linecap="round"/>
  </g>
  
  <!-- Signal waves (IoT indicator) -->
  <g transform="translate(680, 280)" stroke="white" stroke-width="28" fill="none" stroke-linecap="round">
    <path d="M0 60 A60 60 0 0 1 60 0" opacity="0.5"/>
    <path d="M0 120 A120 120 0 0 1 120 0" opacity="0.7"/>
    <path d="M0 180 A180 180 0 0 1 180 0" opacity="0.9"/>
  </g>
</svg>
